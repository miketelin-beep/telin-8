
<!DOCTYPE html>
<html>
<head>
    <title>Javascript Web Output #3</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 8px;
        }

        table {
            border-collapse: collapse;
            width: 90%;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid gray;
            padding: 8px;
            text-align: left;
        }

        th {
            text-align: center;
        }

        .completed {
            color: green;
            font-weight: bold;
        }

        .not-completed {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h2>Javascript Web Output #3</h2>

<button onclick="loadData()">Load data from the API</button>
<button onclick="clearTable()">Clear Table</button>

<p>
    API:
    <a href="https://jsonplaceholder.typicode.com/todos/" target="_blank">
        https://jsonplaceholder.typicode.com/todos/
    </a>
</p>

<table>
    <thead>
        <tr>
            <th>User ID</th>
            <th>Task ID</th>
            <th>Title</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody id="dataTable"></tbody>
</table>

<script>

async function loadData() {

    let table = document.getElementById("dataTable");

    table.innerHTML = "<tr><td colspan='4'>Loading...</td></tr>";

    try {

        let response = await fetch(
            "https://jsonplaceholder.typicode.com/todos/"
        );

        let data = await response.json();

        table.innerHTML = "";

        data.forEach(function(todo) {

            let row = document.createElement("tr");

            let status = todo.completed
                ? "Completed"
                : "Not yet Completed";

            let statusClass = todo.completed
                ? "completed"
                : "not-completed";

            row.innerHTML = `
                <td>${todo.userId}</td>
                <td>${todo.id}</td>
                <td>${todo.title}</td>
                <td class="${statusClass}">${status}</td>
            `;

            table.appendChild(row);

        });

    } catch (error) {

        table.innerHTML =
            "<tr><td colspan='4'>Error loading API data!</td></tr>";

        console.log(error);
    }
}

function clearTable() {

    document.getElementById("dataTable").innerHTML = "";

}

</script>

</body>
</html>
